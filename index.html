<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; media-src 'self' blob:; frame-src https://www.youtube-nocookie.com https://www.youtube.com; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://generativelanguage.googleapis.com https://www.youtube.com http://localhost:* http://127.0.0.1:*; manifest-src 'self'; worker-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video Briefs</title>
<meta name="description" content="Paste a YouTube link; Gemini watches it and writes a brief you can read in a minute. Works offline; syncs through your own Google Drive.">
<meta name="theme-color" content="#1F5E63">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --paper:#F3F0EA; --surface:#FBFAF7; --sunk:#E9E5DC; --raise:#FFFFFF;
  --ink:#1D2224; --ink-2:#3F494D; --muted:#687477; --faint:#98A2A4;
  --rule:#D9D3C7; --rule-2:#E5E0D6;
  --accent:#1F5E63; --accent-ink:#FFFFFF; --accent-soft:#DCE9E8; --accent-line:#A8C9C7;
  --ok:#2F6B45; --ok-soft:#DDEBDF; --warn:#8A5A0B; --warn-soft:#F5E6C6; --bad:#A3302C; --bad-soft:#F6DAD6;
  --mark:#F3D98B;
  --sh-1:0 1px 2px rgba(30,40,40,.08); --sh-2:0 10px 30px rgba(20,30,30,.18),0 2px 6px rgba(20,30,30,.08);
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --font-read:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --lib:380px; --side:400px; --fs-read:17px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --paper:#111415; --surface:#181C1D; --sunk:#222829; --raise:#1C2122;
  --ink:#E6ECEB; --ink-2:#C0CACA; --muted:#8A9797; --faint:#5E6A6A;
  --rule:#2D3435; --rule-2:#252B2C;
  --accent:#6CC3C0; --accent-ink:#0E1213; --accent-soft:#1C3332; --accent-line:#2E5754;
  --ok:#86C59A; --ok-soft:#1C3024; --warn:#E5B85C; --warn-soft:#382B12; --bad:#F08C84; --bad-soft:#3C1D1B;
  --mark:#5E4B14;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme=dark]{
  --paper:#111415; --surface:#181C1D; --sunk:#222829; --raise:#1C2122;
  --ink:#E6ECEB; --ink-2:#C0CACA; --muted:#8A9797; --faint:#5E6A6A;
  --rule:#2D3435; --rule-2:#252B2C;
  --accent:#6CC3C0; --accent-ink:#0E1213; --accent-soft:#1C3332; --accent-line:#2E5754;
  --ok:#86C59A; --ok-soft:#1C3024; --warn:#E5B85C; --warn-soft:#382B12; --bad:#F08C84; --bad-soft:#3C1D1B;
  --mark:#5E4B14;
  --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4);
  color-scheme:dark;
}
:root[data-size=s]{--fs-read:15.5px} :root[data-size=l]{--fs-read:19px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default;opacity:.45}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
kbd{font:11px/1 var(--font-ui);padding:2px 5px;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;color:var(--muted);background:var(--surface)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:var(--lib) minmax(0,1fr);height:100vh;height:100dvh}
.lib{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule);background:var(--surface)}
.lib-top{padding:16px 16px 10px;border-bottom:1px solid var(--rule-2)}
.brand{display:flex;align-items:center;gap:9px;margin:0 0 12px;font:600 21px/1 var(--font-read);letter-spacing:.005em;color:var(--ink)}
.brand .logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:var(--accent-ink)}
.brand .logo svg{width:16px;height:16px;fill:currentColor;stroke:none}
.brand small{margin-left:auto;font:600 10px/1 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.add{display:flex;gap:6px}
.add .inp{height:40px;font-size:14px}
.add .btn{height:40px}
.addhint{margin:7px 2px 0;font-size:12px;color:var(--muted)}
.addhint kbd{font-size:10px}
.lib-tools{padding:10px 16px 6px}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search .inp{height:34px;padding-left:34px;padding-right:34px;background:var(--paper);border-color:var(--rule-2)}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%)}
.search .clr{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px}
.filters{display:flex;gap:4px;margin-top:8px;overflow-x:auto;scrollbar-width:none}
.filters button{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border:1px solid transparent;border-radius:13px;background:none;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap}
.filters button:hover{background:var(--sunk);color:var(--ink)}
.filters button.on{background:var(--ink);color:var(--paper)}
.filters .n{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.list{flex:1;min-height:0;overflow:auto;padding:4px 8px 12px}
.row{display:grid;grid-template-columns:112px minmax(0,1fr);gap:10px;width:100%;padding:8px;border:1px solid transparent;border-radius:11px;background:none;text-align:left;color:var(--ink);margin-bottom:2px;position:relative}
.row:hover{background:var(--paper)}
.row.sel{background:var(--accent-soft);border-color:var(--accent-line)}
.thumb{position:relative;width:112px;aspect-ratio:16/9;border-radius:7px;overflow:hidden;background:var(--sunk);display:grid;place-items:center;color:var(--faint)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .dur{position:absolute;right:4px;bottom:4px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.72);color:#fff;font:600 10.5px/1.4 var(--font-ui);font-variant-numeric:tabular-nums}
.thumb svg{width:26px;height:26px}
.row .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:13.5px;font-weight:600;line-height:1.35}
.row.unread .t::before{content:"";display:inline-block;width:7px;height:7px;margin:0 6px 1px 0;border-radius:50%;background:var(--accent);vertical-align:middle}
.row .m{display:flex;gap:6px;align-items:center;margin-top:3px;font-size:12px;color:var(--muted);min-width:0}
.row .m span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .star{color:var(--warn)}
.row .star svg{width:13px;height:13px;fill:currentColor}
.state{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:12px;font-weight:600;color:var(--accent)}
.state.bad{color:var(--bad)} .state.wait{color:var(--muted)} .state.warn{color:var(--warn)}
.bar{height:3px;border-radius:2px;background:var(--rule-2);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.spin{width:12px;height:12px;border:2px solid var(--accent-line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lib-foot{display:flex;align-items:center;gap:6px;padding:10px 12px;border-top:1px solid var(--rule-2)}
.none{padding:40px 16px;text-align:center;color:var(--muted);font-size:13px}

/* sync pill */
.pill{display:flex;align-items:center;gap:7px;flex:1;min-width:0;height:32px;padding:0 10px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);color:var(--ink-2);font-size:12.5px;font-weight:550;text-align:left}
.pill span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pill.local .dot{background:var(--faint)}
.pill.busy .dot{background:var(--warn);animation:pulse 1.1s ease-in-out infinite}
.pill.off .dot{background:var(--warn)}
.pill.err{border-color:var(--bad);color:var(--bad)} .pill.err .dot{background:var(--bad)}
.pill:hover{background:var(--sunk)}
@keyframes pulse{50%{opacity:.35}}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--ink-2);flex:none}
.ib:hover:not(:disabled){background:var(--sunk);color:var(--ink)}
.ib.on{color:var(--warn)} .ib.on svg{fill:currentColor}

/* buttons, inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink);font-weight:560;white-space:nowrap;text-decoration:none}
.btn:hover:not(:disabled){background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover:not(:disabled){background:var(--sunk)}
.btn.danger{color:var(--bad)}
.btn.sm{height:28px;padding:0 9px;font-size:12.5px;border-radius:7px}
.btn svg{width:16px;height:16px}
.inp,.ta,select.inp{width:100%;padding:8px 11px;border:1px solid var(--rule);border-radius:9px;background:var(--raise);color:var(--ink);font:inherit}
.inp:focus,.ta:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.ta{resize:vertical;min-height:70px;line-height:1.5}
.field{display:flex;flex-direction:column;gap:5px;margin:0 0 12px}
.field>span{font-size:12px;font-weight:600;color:var(--ink-2)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}
.hint.ok{color:var(--ok)} .hint.bad{color:var(--bad)} .hint.warn{color:var(--warn)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--ink-2);margin:4px 0 10px;cursor:pointer}
.chk input{margin-top:3px;accent-color:var(--accent)}

/* ---------- reader ---------- */
.main{min-width:0;min-height:0;display:flex;flex-direction:column}
.banners:empty{display:none}
.banner{display:flex;align-items:center;gap:12px;padding:9px 22px;border-bottom:1px solid var(--rule);font-size:13px}
.banner.warn{background:var(--warn-soft)} .banner.bad{background:var(--bad-soft)} .banner.info{background:var(--accent-soft)}
.banner b{font-weight:650}
.banner .btn{margin-left:auto}
.reader{flex:1;min-height:0;display:flex;flex-direction:column}
.rhead{padding:18px 28px 0;border-bottom:1px solid var(--rule-2);background:var(--paper)}
.rtitle{display:flex;align-items:flex-start;gap:10px}
.back{display:none}
.rtitle h1{flex:1;margin:0;font:600 25px/1.2 var(--font-read);letter-spacing:-.005em;overflow-wrap:anywhere}
.ract{display:flex;gap:2px;align-items:center;flex:none;margin-top:-3px}
.rmeta{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center;margin:7px 0 0;font-size:13px;color:var(--muted)}
.rmeta a{color:var(--muted);text-decoration:none;border-bottom:1px solid var(--rule)}
.rmeta a:hover{color:var(--accent);border-color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:11px;background:var(--sunk);color:var(--ink-2);font-size:11.5px;font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.tabs{display:flex;gap:2px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{display:inline-flex;gap:6px;align-items:center;height:38px;padding:0 13px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.tabs .n{font-size:11px;font-weight:600;color:var(--faint)}
.rbody{flex:1;min-height:0;overflow:auto;scroll-behavior:smooth}
.cols{display:grid;grid-template-columns:minmax(0,1fr) var(--side);gap:28px;max-width:1280px;margin:0 auto;padding:24px 28px 80px}
.cols.single{grid-template-columns:minmax(0,1fr);max-width:820px}
.side{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:14px}
.text{min-width:0;max-width:740px}

/* player */
.player{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;box-shadow:var(--sh-1)}
.player iframe,.player video{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .cover{position:absolute;inset:0;display:grid;place-items:center;border:0;padding:0;background:#000 center/cover no-repeat;cursor:pointer}
.player .cover::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.55))}
.player .cover span{position:relative;z-index:1;display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff}
.player .cover span svg{width:24px;height:24px;fill:#fff;stroke:none;margin-left:3px}
.player .cover em{position:absolute;left:12px;bottom:10px;z-index:1;color:#fff;font:600 12px var(--font-ui);font-style:normal}
.pnote{font-size:12px;color:var(--muted);margin:-6px 2px 0}
.mini{display:none}

/* side panel blocks */
.panel{padding:14px 16px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.panel h3{margin:0 0 8px;font:650 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mlist{display:flex;flex-direction:column;gap:2px;margin:0 -6px}
.mrow{display:flex;gap:10px;align-items:baseline;width:100%;padding:6px;border:0;border-radius:8px;background:none;text-align:left;color:var(--ink-2);font-size:13.5px;line-height:1.4}
.mrow:hover{background:var(--sunk);color:var(--ink)}
.mrow.now{background:var(--accent-soft);color:var(--ink)}
.ts{display:inline-flex;align-items:center;height:20px;padding:0 6px;border:0;border-radius:5px;background:var(--accent-soft);color:var(--accent);font:650 11.5px/1 var(--font-ui);font-variant-numeric:tabular-nums;vertical-align:1px;white-space:nowrap;cursor:pointer;text-decoration:none}
.ts:hover{background:var(--accent);color:var(--accent-ink)}
span.ts{cursor:inherit} .mrow:hover span.ts,.worth .rng button:hover span.ts{background:var(--accent);color:var(--accent-ink)}

/* the card */
.card{position:relative;padding:22px 24px 18px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);box-shadow:var(--sh-1)}
.kicker{font:650 10.5px/1 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.thesis{margin:0;font:500 22px/1.38 var(--font-read);color:var(--ink)}
.verdict{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;margin-top:16px;padding-top:14px;border-top:1px solid var(--rule-2)}
.verdict p{margin:0;font:16px/1.5 var(--font-read);color:var(--ink-2)}
.conf{display:flex;flex-direction:column;align-items:flex-end;gap:5px;min-width:110px}
.conf b{font:700 20px/1 var(--font-ui);font-variant-numeric:tabular-nums}
.conf small{font-size:11px;color:var(--muted)}
.meter{width:110px;height:6px;border-radius:3px;background:var(--rule-2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px}
.c-hi b{color:var(--ok)} .c-hi .meter i{background:var(--ok)}
.c-mid b{color:var(--warn)} .c-mid .meter i{background:var(--warn)}
.c-lo b{color:var(--bad)} .c-lo .meter i{background:var(--bad)}
.lowconf{margin:10px 0 0;padding:7px 10px;border-radius:8px;background:var(--warn-soft);color:var(--ink);font-size:12.5px}
.worth{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--paper);font-size:13.5px;color:var(--ink-2)}
.worth b{color:var(--ink)}
.worth .w-skip{color:var(--bad)} .worth .w-parts{color:var(--warn)} .worth .w-watch{color:var(--ok)}
.worth .rng{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.worth .rng button{display:inline-flex;gap:6px;align-items:center;max-width:100%;padding:4px 9px 4px 5px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);font-size:12.5px;color:var(--ink-2);text-align:left}
.worth .rng button:hover{border-color:var(--accent)}
.pred{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;margin-top:12px;font-size:14px;color:var(--ink-2)}
.pred .odds{font:700 13px/1 var(--font-ui);padding:5px 8px;border-radius:8px;background:var(--accent-soft);color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
.pred svg{color:var(--muted);margin-top:2px}
.betterq{margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.betterq b{color:var(--ink)}
.cardtags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 9px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);color:var(--ink-2);font-size:11.5px;font-weight:550}
button.tag:hover{border-color:var(--accent);color:var(--accent)}
.tag.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.inline-moments{margin-top:14px}

/* reading text */
.doc{margin-top:26px;font:var(--fs-read)/1.68 var(--font-read);color:var(--ink)}
.doc h2{margin:30px 0 10px;font:650 12px/1.2 var(--font-ui);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.doc h3,.doc h4{margin:22px 0 8px;font:650 16px/1.3 var(--font-ui)}
.doc p{margin:0 0 14px}
.doc ol,.doc ul{margin:0 0 14px;padding-left:24px}
.doc li{margin:0 0 7px}
.doc li::marker{color:var(--muted);font-family:var(--font-ui);font-size:.85em}
.doc blockquote{margin:0 0 14px;padding:4px 0 4px 16px;border-left:3px solid var(--accent-line);color:var(--ink-2)}
.doc code{font:13px ui-monospace,Consolas,monospace;padding:1px 4px;border-radius:4px;background:var(--sunk)}
.doc pre{padding:12px;border-radius:9px;background:var(--sunk);overflow:auto;font:13px/1.5 ui-monospace,Consolas,monospace}
.doc hr{border:0;border-top:1px solid var(--rule);margin:22px 0}
.doc table{width:100%;border-collapse:collapse;margin:0 0 16px;font:14px/1.45 var(--font-ui)}
.doc th,.doc td{padding:7px 9px;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:top}
.doc th{font-weight:650;color:var(--muted);font-size:12.5px}
.doc strong{font-weight:650}
.doc a{text-decoration:none;border-bottom:1px solid var(--accent-line)}
.caret::after{content:"";display:inline-block;width:8px;height:1.1em;margin-left:3px;vertical-align:-3px;background:var(--accent);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule-2);font-size:12.5px;color:var(--muted)}
.foot p{margin:0 0 6px}
.flags{margin:0 0 10px;padding:10px 12px;border-radius:9px;background:var(--warn-soft);color:var(--ink);font-size:12.5px}
.flags ul{margin:4px 0 0;padding-left:18px}

/* working / failed states */
.work{max-width:640px;margin:40px auto;padding:0 28px}
.steps{list-style:none;margin:18px 0;padding:0}
.steps li{display:flex;gap:10px;align-items:center;padding:8px 0;color:var(--muted);font-size:14px}
.steps li.done{color:var(--ink-2)} .steps li.now{color:var(--ink);font-weight:600}
.steps li .ic{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--rule);flex:none}
.steps li.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.steps li.done .ic svg{width:13px;height:13px;stroke-width:2.4}
.steps li.now .ic{border-color:var(--accent)}
.errbox{padding:14px 16px;border-radius:12px;background:var(--bad-soft);color:var(--ink);font-size:14px}
.errbox p{margin:0 0 10px}

/* transcript */
.txtools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.txtools .search{flex:1;min-width:180px}
.txsrc{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.seg{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:7px 8px;margin:0 -8px;border-radius:9px;font:15.5px/1.6 var(--font-read);color:var(--ink)}
.seg.now{background:var(--accent-soft)}
.seg .who{display:block;font:650 11px/1.6 var(--font-ui);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.seg.scr{font:13px/1.5 var(--font-ui);color:var(--ink-2)}
.seg.scr .body{padding:6px 10px;border-left:3px solid var(--accent-line);background:var(--surface);border-radius:0 8px 8px 0}
.seg.scr .body::before{content:"On screen";display:block;font:650 10px/1.4 var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}

/* ask */
.qa{margin:0 0 22px}
.qa .q{display:flex;gap:10px;align-items:flex-start;font:650 15px/1.45 var(--font-ui);color:var(--ink)}
.qa .q span{flex:1}
.qa .a{margin-top:8px}
.qa .a .doc{margin-top:0}
.qa .meta{font-size:11.5px;color:var(--faint);margin-top:2px}
.askbox{position:sticky;bottom:0;padding:12px 0 8px;background:linear-gradient(transparent,var(--paper) 22%)}
.askbox .ta{min-height:54px;font-size:14.5px;background:var(--surface)}
.askrow{display:flex;gap:10px;align-items:center;margin-top:8px;flex-wrap:wrap}
.askrow .chk{margin:0;font-size:12.5px}
.sugg{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sugg button{padding:6px 11px;border:1px solid var(--rule);border-radius:16px;background:var(--surface);font-size:13px;color:var(--ink-2);text-align:left}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

/* start page */
.start{max-width:720px;margin:0 auto;padding:46px 32px 60px}
.start h1{margin:0 0 8px;font:600 32px/1.15 var(--font-read)}
.start .lede{margin:0 0 24px;color:var(--ink-2);font-size:15px}
.check{display:flex;flex-direction:column;gap:8px;margin:0 0 26px}
.ck{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
.ck .ic{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--rule);color:var(--muted);font:700 12px var(--font-ui)}
.ck.done .ic{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.done .ic svg{width:14px;height:14px;stroke-width:2.4}
.ck b{display:block;font-size:14px} .ck span{font-size:12.5px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.how div{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--rule-2);font-size:13px;color:var(--ink-2)}
.how b{display:block;margin-bottom:4px;color:var(--ink);font-size:13.5px}

/* drop overlay */
.drop{position:fixed;inset:0;z-index:70;display:grid;place-items:center;background:rgba(15,30,30,.55);pointer-events:none}
.drop div{padding:28px 36px;border:2px dashed #fff;border-radius:18px;color:#fff;font:600 18px var(--font-ui);text-align:center}
.drop small{display:block;font-weight:500;font-size:13px;opacity:.85;margin-top:6px}

/* modal, menus, toasts */
.scrim{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:20px;background:rgba(15,25,25,.45);animation:fade .12s ease-out}
@keyframes fade{from{opacity:0}}
.modal{display:flex;flex-direction:column;width:min(560px,100%);max-height:min(90vh,900px);background:var(--surface);border-radius:16px;box-shadow:var(--sh-2);overflow:hidden}
.modal.wide{width:min(780px,100%)}
.mhead{display:flex;align-items:center;gap:10px;padding:16px 18px 10px 22px}
.mhead h2{margin:0;font:600 21px/1.2 var(--font-read)}
.mhead .ib{margin-left:auto}
.mbody{flex:1;min-height:0;overflow:auto;padding:6px 22px 18px}
.mfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--rule-2);background:var(--paper)}
.mtext{margin:0 0 12px;color:var(--ink-2)}
.mtabs{display:flex;gap:2px;padding:0 18px;border-bottom:1px solid var(--rule-2);overflow-x:auto}
.mtabs button{height:38px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.mtabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.box{padding:12px 14px;border:1px solid var(--rule);border-radius:11px;background:var(--paper);margin:0 0 12px}
.box h4{margin:0 0 6px;font-size:13px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
.olsteps{margin:6px 0 0;padding-left:20px;font-size:13px;color:var(--ink-2)}
.olsteps li{margin:0 0 6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:6px 8px;border-bottom:1px solid var(--rule-2);text-align:left;vertical-align:top}
.loglist{font:12px/1.5 ui-monospace,Consolas,monospace;max-height:340px;overflow:auto;padding:10px;border:1px solid var(--rule);border-radius:9px;background:var(--paper);white-space:pre-wrap}
.segc{display:inline-flex;padding:2px;border-radius:9px;background:var(--sunk);flex-wrap:wrap}
.segc button{height:28px;padding:0 12px;border:0;border-radius:7px;background:none;color:var(--muted);font-weight:600}
.segc button.on{background:var(--surface);color:var(--ink);box-shadow:var(--sh-1)}
.bm{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1px dashed var(--accent);border-radius:9px;color:var(--accent);font-weight:650;text-decoration:none;cursor:grab;background:var(--accent-soft)}
.menu{position:fixed;z-index:55;min-width:220px;padding:5px;border:1px solid var(--rule);border-radius:11px;background:var(--surface);box-shadow:var(--sh-2)}
.menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;border-radius:7px;background:none;text-align:left;font-size:13.5px}
.menu button:hover{background:var(--sunk)}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--rule-2);margin:4px 0}
.toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;max-width:min(640px,92vw);padding:10px 12px 10px 16px;border-radius:12px;background:var(--ink);color:var(--paper);box-shadow:var(--sh-2);font-size:13.5px;pointer-events:auto;animation:rise .16s ease-out}
.toast button{border:0;background:none;color:var(--accent-soft);font-weight:700;padding:4px 6px;border-radius:6px}
:root[data-theme=dark] .toast button{color:var(--accent-ink)}
.toast button:hover{background:rgba(255,255,255,.12)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}

/* ---------- narrower screens ---------- */
@media (max-width:1250px){ .cols{grid-template-columns:minmax(0,1fr);max-width:820px} .side{position:static;order:-1} .side .player{max-width:560px} .side .panel.moments{display:none} .inline-moments{display:block} }
@media (min-width:1251px){ .inline-moments{display:none} }
@media (max-width:1250px){
  .side .player:not(:has(iframe)):not(:has(video)){aspect-ratio:auto;height:56px;max-width:none;box-shadow:none}
  .side .player .cover{display:flex;align-items:center;justify-content:flex-start;gap:12px;padding:0 10px;background:var(--ink)!important}
  .side .player .cover::after{display:none}
  .side .player .cover span{width:36px;height:36px;background:var(--accent)}
  .side .player .cover span svg{width:16px;height:16px}
  .side .player .cover em{position:static;color:var(--paper);font-size:13.5px}
  .side .pnote{display:none}
}
@media (max-width:1000px){ :root{--lib:320px} .row{grid-template-columns:96px minmax(0,1fr)} .thumb{width:96px} }
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .app.open .lib{display:none}
  .app:not(.open) .main{display:none}
  .back{display:inline-grid}
  .rhead{padding:10px 14px 0}
  .rtitle h1{font-size:20px}
  .cols{padding:14px 14px 70px;gap:16px}
  .card{padding:16px}
  .thesis{font-size:19px}
  .verdict{grid-template-columns:1fr}
  .conf{align-items:flex-start}
  .how{grid-template-columns:1fr}
  .start{padding:26px 18px 50px}
  .row2{grid-template-columns:1fr}
  .side{margin:-14px -14px 0;padding:0;background:#000}
  .side.live{position:sticky;top:0;z-index:4}
  .side .player{border-radius:0;max-width:none}
  .side .pnote{display:none}
  .seg{grid-template-columns:52px minmax(0,1fr);font-size:15px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="lib" aria-label="Library">
    <div class="lib-top">
      <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg></span>Video Briefs<small id="build-tag"></small></div>
      <form class="add" id="add-form" autocomplete="off">
        <input class="inp" id="add-in" placeholder="Paste a YouTube link" aria-label="YouTube link to brief" spellcheck="false">
        <button class="btn primary" id="add-btn" type="submit">Brief it</button>
      </form>
      <p class="addhint" id="add-hint">Or press <kbd>Ctrl</kbd>+<kbd>V</kbd> anywhere. Pasting a transcript (from NoteGPT, say) or dropping a recording works too.</p>
    </div>
    <div class="lib-tools">
      <div class="search"><span id="search-ic"></span><input class="inp" id="q" placeholder="Search briefs" aria-label="Search briefs" spellcheck="false"><kbd id="q-kbd">/</kbd><button class="ib clr" id="q-clr" aria-label="Clear search" hidden></button></div>
      <div class="filters" id="filters" role="tablist" aria-label="Show"></div>
      <div class="tagrow" id="tagrow"></div>
    </div>
    <div class="list" id="list" role="listbox" aria-label="Briefs"></div>
    <div class="lib-foot">
      <button class="pill local" id="sync-pill" title="Drive sync"><i class="dot"></i><span>Loading…</span></button>
      <button class="ib" id="help-btn" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts"></button>
      <button class="ib" id="settings-btn" title="Settings" aria-label="Settings"></button>
    </div>
  </aside>
  <main class="main">
    <div class="banners" id="banners"></div>
    <section class="reader" id="reader" aria-live="polite"><div class="start"><p>Opening your briefs…</p></div></section>
  </main>
</div>
<div class="drop" id="drop" hidden><div>Drop to brief it<small>YouTube links, recordings (MP4, MP3, M4A…) or transcripts (VTT, SRT, TXT)</small></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>
<div id="elsewhere" class="scrim" hidden style="z-index:80"></div>
<input type="file" id="file-in" hidden>
<div id="probe" aria-hidden="true" style="position:fixed;left:-10000px;top:0;width:320px;height:180px;overflow:hidden"></div>
<script>
const BUILD = "1.0 \u00b7 8b2209";
const SYNC_SCRIPT = "/**\n * Video Briefs sync: keeps the shared copy of your Video Briefs library in your own Google Drive.\n *\n *   Folder : My Drive / 00_Apps / Video Briefs /\n *     index.json   the list of briefs, each with a revision number\n *     _data/       one JSON file per brief (card, brief, transcript, questions). Leave alone.\n *     Briefs/      a readable Markdown copy of every finished brief (open it anywhere: UpNote, Claude, NotebookLM)\n *     backups/     daily copies of index.json (newest 40 kept; older ones go to Drive Trash)\n *\n * One-time setup\n *   1. Run \"setup\" once (Run button). Allow access when Google asks.\n *   2. Copy the sync key from the Execution log.\n *   3. Deploy > New deployment > Web app. Execute as: Me. Who has access: Anyone.\n *   4. Paste the Web app link (ends in /exec) and the key into Video Briefs > Settings > Drive sync.\n *\n * The script answers only requests that carry your sync key. The key, and your Gemini API key if you\n * choose to keep it here for your other devices, live in this script's properties, never in the public page.\n *\n * A device sends a changed brief with the revision it was based on. If another device changed that brief\n * in the meantime, the script refuses the write and returns the current copy so the device can merge it.\n * Deleting a brief forever moves its files to Drive Trash (recoverable for 30 days), never straight to oblivion.\n */\nvar APP = 'videobriefs-sync', VERSION = 1;\nvar FOLDERS = ['00_Apps', 'Video Briefs'];\nvar INDEX = 'index.json', DATA = '_data', MD = 'Briefs', BACKUP = 'backups';\nvar KEEP_BACKUPS = 40, AUTO_BACKUP_HOURS = 20;\nvar MAX_BYTES = 3500000, MAX_MS = 20000;\n\nfunction setup() {\n  var props = PropertiesService.getScriptProperties();\n  var key = props.getProperty('SYNC_KEY');\n  if (!key) {\n    key = (Utilities.getUuid() + Utilities.getUuid()).replace(/-/g, '');\n    props.setProperty('SYNC_KEY', key);\n  }\n  var root = root_();\n  sub_(root, DATA); sub_(root, MD); sub_(root, BACKUP);\n  var idx = indexFile_(root);\n  Logger.log('Video Briefs sync is ready.');\n  Logger.log('Sync key: ' + key);\n  Logger.log('Folder: ' + root.getUrl());\n  Logger.log('Next: Deploy > New deployment > Web app (Execute as: Me, Who has access: Anyone). Paste the Web app link and this key into Video Briefs.');\n  return idx.getUrl();\n}\n\n/* Run this only if a setup link was shared by mistake. Every device then needs the new key. */\nfunction newKey() {\n  PropertiesService.getScriptProperties().deleteProperty('SYNC_KEY');\n  setup();\n}\n\nfunction doGet() {\n  return json_({ ok: true, app: APP, v: VERSION, note: 'Video Briefs sync is running. Use this link inside Video Briefs.' });\n}\n\nfunction doPost(e) {\n  var req;\n  try { req = JSON.parse(e.postData.contents); } catch (err) { return json_({ ok: false, error: 'bad_json' }); }\n  var props = PropertiesService.getScriptProperties();\n  var key = props.getProperty('SYNC_KEY');\n  if (!key || !req || typeof req.key !== 'string' || req.key !== key) return json_({ ok: false, error: 'bad_key' });\n  if (req.op === 'ping') return json_({ ok: true, app: APP, v: VERSION });\n  if (req.op === 'config') return json_(config_(req, props));\n\n  var lock = LockService.getScriptLock();\n  if (!lock.tryLock(25000)) return json_({ ok: false, error: 'busy' });\n  try {\n    if (req.op === 'sync') return json_(sync_(req));\n    if (req.op === 'info') return json_(info_());\n    return json_({ ok: false, error: 'bad_op' });\n  } catch (err) {\n    if (err && err.code) return json_({ ok: false, error: err.code });\n    return json_({ ok: false, error: 'server', detail: String((err && err.message) || err).slice(0, 300) });\n  } finally {\n    lock.releaseLock();\n  }\n}\n\n/* The Gemini key, kept here so a newly connected device can pick it up. */\nfunction config_(req, props) {\n  if (req.set && typeof req.set === 'object') {\n    if (typeof req.set.gemini === 'string') {\n      var g = req.set.gemini.trim();\n      if (g) props.setProperty('GEMINI_KEY', g.slice(0, 200)); else props.deleteProperty('GEMINI_KEY');\n    }\n    if (typeof req.set.model === 'string') props.setProperty('GEMINI_MODEL', req.set.model.slice(0, 80));\n  }\n  return { ok: true, gemini: props.getProperty('GEMINI_KEY') || '', model: props.getProperty('GEMINI_MODEL') || '' };\n}\n\n/* ---------- sync ---------- */\nfunction sync_(req) {\n  var t0 = Date.now();\n  var root = root_();\n  var idxFile = indexFile_(root);\n  var store = readIndex_(idxFile);\n  var recs = store.records;\n  var now = Date.now();\n  var device = String(req.device || '').slice(0, 60);\n  var changes = Array.isArray(req.changes) ? req.changes : [];\n  var accepted = [], conflicts = [], apply = [], done = {};\n\n  for (var i = 0; i < changes.length; i++) {\n    var ch = changes[i];\n    if (!ch || typeof ch.id !== 'string' || !ch.id || ch.id.length > 120 || !/^[A-Za-z0-9_-]+$/.test(ch.id) || done[ch.id]) continue;\n    done[ch.id] = true;\n    if (!ch.purge && (!ch.data || typeof ch.data !== 'object' || ch.data.id !== ch.id)) continue;\n    var cur = recs[ch.id];\n    var base = ch.baseRev === undefined ? null : ch.baseRev;\n    if (cur && cur.rev !== base && !(cur.purged && ch.purge)) {\n      conflicts.push({ id: ch.id, rev: cur.rev, purged: !!cur.purged, device: cur.device || '', data: cur.purged ? null : readData_(cur) });\n      continue;\n    }\n    if (!cur && ch.purge) { accepted.push({ id: ch.id, rev: null }); continue; }\n    apply.push(ch);\n  }\n\n  if (apply.length) {\n    var due = !store.lastBackupAt || now - store.lastBackupAt > AUTO_BACKUP_HOURS * 3600 * 1000;\n    if (due && Object.keys(recs).length) { backup_(idxFile, root); store.lastBackupAt = now; }\n    var dataDir = sub_(root, DATA), mdDir = sub_(root, MD);\n    for (var j = 0; j < apply.length; j++) {\n      var c = apply[j], r = recs[c.id] || {};\n      store.rev += 1;\n      if (c.purge) {\n        trash_(r.fid); trash_(r.mid);\n        recs[c.id] = { rev: store.rev, updated: now, device: device, purged: true };\n      } else {\n        var text = JSON.stringify(c.data);\n        var fid = write_(dataDir, r.fid, c.id + '.json', text, 'application/json');\n        var mid = r.mid || '';\n        if (typeof c.md === 'string') {\n          if (c.md) mid = write_(mdDir, r.mid, String(c.mdName || (c.id + '.md')).slice(0, 180), c.md, 'text/markdown');\n          else { trash_(r.mid); mid = ''; }\n        }\n        recs[c.id] = { rev: store.rev, updated: now, device: device, purged: false, fid: fid, mid: mid, size: text.length,\n          title: String(c.data.title || '').slice(0, 120), status: String(c.data.status || ''), deleted: !!c.data.deleted_at };\n      }\n      accepted.push({ id: c.id, rev: store.rev });\n    }\n    store.savedAt = new Date(now).toISOString();\n    store.savedBy = device;\n    idxFile.setContent(JSON.stringify(store));\n  }\n\n  var have = req.have && typeof req.have === 'object' ? req.have : {};\n  var skip = {};\n  accepted.forEach(function (a) { skip[a.id] = true; });\n  conflicts.forEach(function (c) { skip[c.id] = true; });\n  var updates = [], bytes = 0, more = false, unreadable = [];\n  var ids = Object.keys(recs).sort(function (a, b) { return (recs[b].updated || 0) - (recs[a].updated || 0); });\n  for (var k = 0; k < ids.length; k++) {\n    var id = ids[k], rr = recs[id];\n    if (skip[id] || have[id] === rr.rev) continue;\n    if (rr.purged && have[id] === undefined) continue;   // nothing to remove on a device that never had it\n    if (updates.length && (bytes > MAX_BYTES || Date.now() - t0 > MAX_MS)) { more = true; break; }\n    if (rr.purged) { updates.push({ id: id, rev: rr.rev, purged: true, device: rr.device || '' }); continue; }\n    var d = readData_(rr);\n    if (!d) { unreadable.push(id); continue; }\n    bytes += rr.size || 0;\n    updates.push({ id: id, rev: rr.rev, purged: false, device: rr.device || '', data: d });\n  }\n  return {\n    ok: true, accepted: accepted, conflicts: conflicts, updates: updates, more: more, unreadable: unreadable,\n    serverRev: store.rev, count: liveCount_(recs), savedAt: store.savedAt || null, savedBy: store.savedBy || '',\n    lastBackupAt: store.lastBackupAt || null,\n  };\n}\n\nfunction info_() {\n  var root = root_();\n  var store = readIndex_(indexFile_(root));\n  return { ok: true, app: APP, v: VERSION, folderUrl: root.getUrl(), briefsUrl: sub_(root, MD).getUrl(), count: liveCount_(store.records), serverRev: store.rev,\n    savedAt: store.savedAt || null, savedBy: store.savedBy || '', lastBackupAt: store.lastBackupAt || null };\n}\n\nfunction liveCount_(recs) {\n  var n = 0;\n  Object.keys(recs).forEach(function (id) { var r = recs[id]; if (!r.purged && !r.deleted) n++; });\n  return n;\n}\n\n/* ---------- files ---------- */\nfunction write_(folder, fileId, name, text, mime) {\n  if (fileId) {\n    try {\n      var f = DriveApp.getFileById(fileId);\n      if (!f.isTrashed()) { f.setContent(text); if (f.getName() !== name) f.setName(name); return fileId; }\n    } catch (err) { /* gone: make a new one */ }\n  }\n  return folder.createFile(name, text, mime).getId();\n}\nfunction readData_(r) {\n  if (!r || !r.fid) return null;\n  try { return JSON.parse(DriveApp.getFileById(r.fid).getBlob().getDataAsString()); } catch (err) { return null; }\n}\nfunction trash_(fileId) {\n  if (!fileId) return;\n  try { DriveApp.getFileById(fileId).setTrashed(true); } catch (err) { }\n}\n\n/* ---------- backups of the index ---------- */\nfunction backup_(idxFile, root) {\n  var folder = sub_(root, BACKUP);\n  var stamp = new Date().toISOString().replace(/:/g, '-').replace(/\\.\\d+Z$/, 'Z');\n  folder.createFile('index_' + stamp + '.json', idxFile.getBlob().getDataAsString(), 'application/json');\n  var files = [], it = folder.getFiles();\n  while (it.hasNext()) { var f = it.next(); if (/^index_.*\\.json$/.test(f.getName())) files.push(f); }\n  files.sort(function (a, b) { return b.getDateCreate     S.mdh = S.mdh || {};
    while (more && rounds++ < 25) {
      // send up to ~1.5 MB of changes per call
      const sent = new Map(), changes = [];
      let bytes = 0, capped = false;
      for (const id of Object.keys(S.dirty)) {
        const full = await fullRecord(id);
        if (!full) { delete S.dirty[id]; continue; }
        const json = JSON.stringify(full);
        if (changes.length && bytes + json.length > 1500000) { capped = true; break; }
        const md = mdFor(full), mh = VB.hash(md);
        const ch = { id, baseRev: S.base[id] === undefined ? null : S.base[id], data: full };
        if (S.mdh[id] !== mh) { ch.md = md; ch.mdName = VB.safeFileName(full); }
        sent.set(id, { json: JSON.stringify(App.recs.get(id)), mh });
        changes.push(ch); bytes += json.length;
      }
      for (const [id, rev] of Object.entries(S.purge)) changes.push({ id, baseRev: rev, purge: true });
      const out = await syncCall({ op: 'sync', v: 1, key: S.key, device: S.device, changes, have: Object.assign({}, S.base) });
      for (const a of out.accepted || []) {
        if (!sent.has(a.id)) { if (S.purge[a.id] !== undefined) { delete S.purge[a.id]; delete S.base[a.id]; delete S.mdh[a.id]; stats.up++; } continue; }
        S.base[a.id] = a.rev; S.mdh[a.id] = sent.get(a.id).mh; stats.up++;
        if (JSON.stringify(App.recs.get(a.id)) === sent.get(a.id).json) delete S.dirty[a.id];   // changed again during the call: stays queued
      }
      for (const c of out.conflicts || []) await reconcile(c.id, c.rev, c.data, c.purged, c.device, stats);
      for (const u of out.updates || []) { await reconcile(u.id, u.rev, u.data, u.purged, u.device, stats); stats.down++; }
      if ((out.unreadable || []).length) logEvent('error', `Drive has ${plural(out.unreadable.length, 'brief file')} it can’t read; left untouched.`);
      S.server = { count: out.count, savedAt: out.savedAt, savedBy: out.savedBy, lastBackupAt: out.lastBackupAt, rev: out.serverRev };
      // after a clash the merged copy goes straight back up, so the other device sees it on its next sync
      more = !!out.more || capped || ((out.conflicts || []).length > 0 && rounds < 4 && Object.keys(S.dirty).length > 0);
      if (stats.changed) renderSoon();
    }
    Sync.err = null; Sync.detail = ''; Sync.fails = 0; S.lastSync = Date.now();
    if (stats.up || stats.down) logEvent('sync', `Synced: ${stats.up} sent, ${stats.down} received${stats.merged ? `, ${stats.merged} merged` : ''}.`);
    if (!App.gem.key) fetchSharedKey();
  } catch (e) {
    Sync.err = (e && e.code) || 'network'; Sync.detail = (e && e.detail) || '';
    Sync.fails++;
    if (!['offline', 'network', 'timeout', 'busy'].includes(Sync.err) || Sync.fails === 1) logEvent('error', 'Sync failed: ' + syncErrText(Sync.err, Sync.detail) + '.');
  } finally {
    Sync.busy = false;
    metaSoon(); await flush();
    if (stats.changed) { renderSoon(); Engine.kick(); } else updatePill();
    if (stats.kept.length) toast(`${plural(stats.kept.length, 'brief')} deleted on one device but changed on another ${stats.kept.length === 1 ? 'was' : 'were'} kept.`, { ms: 9000 });
    if (manual && !Sync.err) toast(stats.down || stats.up ? `Synced: ${stats.up} sent, ${stats.down} received.` : 'Up to date with Drive.');
    if (manual && Sync.err) toast('Sync failed: ' + syncErrText(Sync.err, Sync.detail) + '.', { ms: 9000 });
    if (Sync.again) { Sync.again = false; syncSoon(400); }
    else if (Sync.err === 'bad_key' || Sync.err === 'corrupt_store') { }
    else if (pendingCount() && Sync.err) syncSoon(Math.min(300000, 15000 * Math.pow(2, Math.min(Sync.fails, 4))));
    else if (pendingCount()) syncSoon(1500);
  }
}

function syncInit() {

/* ============ Gemini: watching, writing and answering, straight from this browser ============ */
const gemBase = () => { try { return localStorage.getItem('videobriefs.geminiBase') || 'https://generativelanguage.googleapis.com'; } catch (e) { return 'https://generativelanguage.googleapis.com'; } };
class GemError extends Error { constructor(cls, status) { super(cls.msg); this.cls = cls; this.status = status; } }
class Pause extends Error { constructor(msg) { super(msg); this.pause = true; } }
class Fail extends Error { constructor(code, msg, step) { super(msg); this.code = code; this.step = step; } }

function countUsage(u) {
  const g = App.gem.usage, d = dayKey();
  if (g.day !== d) Object.assign(g, { day: d, req: 0, inTok: 0, outTok: 0 });
  g.req++;
  if (u) { g.inTok += u.promptTokenCount || 0; g.outTok += (u.candidatesTokenCount || 0) + (u.thoughtsTokenCount || 0); }
  metaSoon();
}
async function gemCall(body, o = {}) {
  const model = o.model || App.gem.model || DEFAULT_MODEL;
  const url = `${gemBase()}/v1beta/models/${encodeURIComponent(model)}:${o.stream ? 'streamGenerateContent?alt=sse' : 'generateContent'}`;
  let res;
  try { res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': o.key || App.gem.key }, body: JSON.stringify(body), signal: o.signal }); }
  catch (e) { if (e.name === 'AbortError') throw e; throw new GemError(VB.classifyError(0, null, true), 0); }
  if (!res.ok) { let j = null; try { j = await res.json(); } catch (e) { } countUsage(null); throw new GemError(VB.classifyError(res.status, j), res.status); }
  if (!o.stream) {
    const j = await res.json();
    countUsage(j.usageMetadata);
    blocked(j);
    return { text: VB.partsText(j), finish: VB.finishReason(j), usage: j.usageMetadata || {}, model };
  }
  const reader = res.body.getReader(), dec = new TextDecoder(), parse = VB.sseParser();
  let text = '', finish = '', usage = {};
  for (; ;) {
    const { value, done } = await reader.read();
    if (done) break;
    for (const ev of parse(dec.decode(value, { stream: true }))) {
      if (ev.error) throw new GemError(VB.classifyError(ev.error.code || 500, ev), ev.error.code || 500);
      blocked(ev);
      const piece = VB.partsText(ev);
      if (piece) { text += piece; if (o.onText) o.onText(text); }
      if (VB.finishReason(ev)) finish = VB.finishReason(ev);
      if (ev.usageMetadata) usage = ev.usageMetadata;
    }
  }
  countUsage(usage);
  return { text, finish, usage, model };
}
function blocked(j) {
  const b = j && j.promptFeedback && j.promptFeedback.blockReason;
  if (b) throw new GemError({ code: 'blocked', msg: `Gemini refused this video or question (${b}).`, retry: 'never' }, 400);
}
/* Retry what is worth retrying; pause the queue for problems that need you; fail the rest. */
async function gemRetry(run, o = {}) {
  let rateTries = 0, serverTries = 0;
  for (; ;) {
    if (o.signal && o.signal.aborted) throw new DOMException('Stopped', 'AbortError');
    try { return await run(); }
    catch (e) {
      if (e.name === 'AbortError' || !e.cls) throw e;
      const c = e.cls;
      if (c.retry === 'wait' && rateTries++ < 8) { await waitFor(o.id, Math.ceil(c.waitS || 30) + 2, 'Gemini asked to slow down; carrying on in', o.signal); continue; }
      if (c.retry === 'backoff' && serverTries++ < 3) { await waitFor(o.id, [6, 20, 60][serverTries - 1], 'Gemini had a hiccup; trying again in', o.signal); continue; }
      if (c.retry === 'online') { await waitOnline(o.id, o.signal); continue; }
      if (c.retry === 'simplify' && o.simplify && o.simplify()) continue;
      if (c.retry === 'tomorrow') { App.gem.pause = { until: VB.nextPacificMidnight(), code: c.code, msg: c.msg }; metaSoon(); throw new Pause(c.msg); }
      if (c.code === 'bad_key' || c.code === 'bad_model') { App.gem.pause = { until: Infinity, code: c.code, msg: c.msg }; metaSoon(); throw new Pause(c.msg); }
      throw e;
    }
  }
}
async function waitFor(id, secs, label, signal) {
  const until = Date.now() + secs * 1000;
  while (Date.now() < until) {
    if (signal && signal.aborted) throw new DOMException('Stopped', 'AbortError');
    if (id) setLive(id, { wait: `${label} ${Math.ceil((until - Date.now()) / 1000)} s` });
    await sleep(1000);
  }
  if (id) setLive(id, { wait: '' });
}
async function waitOnline(id, signal) {
  if (id) setLive(id, { wait: 'Offline; carries on when you’re back online' });
  while (navigator.onLine === false) { if (signal && signal.aborted) throw new DOMException('Stopped', 'AbortError'); await sleep(2000); }
  await sleep(1500);
  if (id) setLive(id, { wait: '' });
}
/* drop optional request settings one at a time if Gemini rejects them */
function simplifier() {
  return () => {
    const o = App.gem.opts;
    for (const k of ['thinking', 'fps', 'media']) if (o[k]) { o[k] = false; metaSoon(); logEvent('gemini', `Gemini rejected the "${k}" setting; carrying on without it.`); return true; }
    return false;
  };
}

/* ---------- files (recordings) ---------- */
function uploadFile(file, onProgress, signal) {
  return new Promise((resolve, reject) => {
    const boundary = 'vb' + VB.rid(18);
    const meta = JSON.stringify({ file: { display_name: file.name.slice(0, 120) } });
    const body = new Blob([`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${boundary}\r\nContent-Type: ${file.type || 'application/octet-stream'}\r\n\r\n`, file, `\r\n--${boundary}--\r\n`]);
    const x = new XMLHttpRequest();
    x.open('POST', `${gemBase()}/upload/v1beta/files?uploadType=multipart`);
    x.setRequestHeader('x-goog-api-key', App.gem.key);
    x.setRequestHeader('X-Goog-Upload-Protocol', 'multipart');
    x.setRequestHeader('Content-Type', 'multipart/related; boundary=' + boundary);
    x.upload.onprogress = e => { if (e.lengthComputable && onProgress) onProgress(e.loaded / e.total); };
    x.onload = () => {
      let j = null; try { j = JSON.parse(x.responseText); } catch (e) { }
      if (x.status >= 200 && x.status < 300 && j && j.file) resolve(j.file);
      else reject(new GemError(VB.classifyError(x.status, j), x.status));
    };
    x.onerror = () => reject(new GemError(VB.classifyError(0, null, true), 0));
    x.onabort = () => reject(new DOMException('Stopped', 'AbortError'));
    if (signal) signal.addEventListener('abort', () => x.abort(), { once: true });
    x.send(body);
  });
}
async function fileState(name) {
  const res = await fetch(`${gemBase()}/v1beta/${name}`, { headers: { 'x-goog-api-key': App.gem.key }, cache: 'no-store' });
  let j = null; try { j = await res.json(); } catch (e) { }
  if (!res.ok) throw new GemError(VB.classifyError(res.status, j), res.status);
  return j;
}
async function deleteGemFile(name) { try { await fetch(`${gemBase()}/v1beta/${name}`, { method: 'DELETE', headers: { 'x-goog-api-key': App.gem.key } }); } catch (e) { } }
function mediaDuration(file) {
  return new Promise(res => {
    const el = document.createElement(/^audio\//.test(file.type) ? 'audio' : 'video');
    const url = URL.createObjectURL(file);
    const done = d => { URL.revokeObjectURL(url); res(isFinite(d) && d > 0 ? d : 0); };
    el.preload = 'metadata'; el.onloadedmetadata = () => done(el.duration); el.onerror = () => done(0);
    setTimeout(() => done(0), 8000);
    el.src = url;
  });
}
async function oembed(videoId) {
  try {
    const r = await fetch('https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(VB.watchUrl(videoId)));
    if (!r.ok) return { missing: r.status };
    const j = await r.json();
    return { title: String(j.title || '').slice(0, 300), channel: String(j.author_name || '').slice(0, 200), channelUrl: /^https:\/\/www\.youtube\.com\//.test(j.author_url || '') ? j.author_url : '' };
  } catch (e) { return null; }
}

/* ---------- the queue: one brief at a time on this device ---------- */
const CLAIM_STALE_MS = 20 * 60000;
const Engine = {
  running: null, ctl: null, timer: 0, pauseTimer: 0,
  kick() { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), 60); },
  next() {
    const me = App.sync.device, now = Date.now();
    return live().filter(r => {
      if (r.kind === 'file' && !App.files.has(r.id) && !(r.claim && r.claim.by === me)) return false;   // only the device holding the recording can upload it
      if (r.status === 'queued') return !(r.claim && r.claim.by !== me && now - VB.ts(r.claim.at) < CLAIM_STALE_MS);
      if (r.status === 'working') return !r.claim || r.claim.by === me || now - VB.ts(r.claim.at) > CLAIM_STALE_MS;
      return false;
    }).sort((a, b) => VB.ts(a.addedAt) - VB.ts(b.addedAt))[0] || null;
  },
  async run() {
    if (!App.owner || this.running || !App.gem.key) { renderSoon(); return; }
    const p = App.gem.pause;
    if (p && Date.now() < p.until) {
      clearTimeout(this.pauseTimer);
      if (isFinite(p.until)) this.pauseTimer = setTimeout(() => { App.gem.pause = null; metaSoon(); this.kick(); }, Math.min(p.until - Date.now() + 1000, 2147483000));
      renderSoon(); return;
    }
    if (p) { App.gem.pause = null; metaSoon(); }
    if (navigator.onLine === false) { renderSoon(); return; }
    const job = this.next();
    if (!job) { renderSoon(); return; }
    const id = job.id;
    this.running = id; this.ctl = new AbortController();
    const signal = this.ctl.signal, started = Date.now();
    try {
      await this.process(id, signal);
      const r = App.recs.get(id);
      if (r && r.status === 'ready') {
        logEvent('brief', `Made "${r.title}" in ${Math.round((Date.now() - started) / 1000)} s.`);
        if (document.visibilityState !== 'visible') unreadBadge();
        else if (App.sel !== id) toast(`Ready: ${r.title}`, { ms: 8000, action: { label: 'Open', fn: () => select(id) } });
      }
    } catch (e) {
      const r = App.recs.get(id);
      if (r && !r.deleted_at) {
        if (e.pause) { editRec(id, x => { x.status = 'queued'; x.claim = null; }); logEvent('gemini', e.message); }
        else if (e.name === 'AbortError') editRec(id, x => { x.status = 'failed'; x.claim = null; x.error = { code: 'stopped', msg: 'You stopped this brief. Press Try again to carry on where it stopped.', step: App.live[id] && App.live[id].stage || '', at: VB.nowIso() }; });
        else {
          const code = e.code || (e.cls && e.cls.code) || 'error', msg = (e.cls && e.cls.msg) || e.message || String(e);
          editRec(id, x => { x.status = 'failed'; x.claim = null; x.error = { code, msg, step: e.step || (App.live[id] && App.live[id].stage) || '', at: VB.nowIso(), detail: e.cls && e.cls.detail || '' }; });
          logEvent('error', `"${(r.title || r.fileName || id)}" failed: ${msg}`);
        }
      }
    } finally {
      this.running = null; this.ctl = null;
      delete App.live[id];
      renderSoon();
      this.kick();
    }
  },
  stop(id) {
    if (this.running === id && this.ctl) { this.ctl.abort(); return; }
    const r = App.recs.get(id);
    if (r && working(r)) editRec(id, x => { x.status = 'failed'; x.claim = null; x.error = { code: 'stopped', msg: 'You stopped this brief before it started.', step: '', at: VB.nowIso() }; });
  },
  retry(id, opts = {}) {
    editRec(id, x => { x.status = 'queued'; x.error = null; x.claim = null; if (opts.remake) { x.remake = opts.remake; } });
    if (App.gem.pause && App.gem.pause.code !== 'daily_limit') { App.gem.pause = null; metaSoon(); }
    this.kick();
  },

  async process(id, signal) {
    const me = App.sync.device;
    let r = editRec(id, x => { x.status = 'working'; x.claim = { by: me, at: VB.nowIso() }; x.error = null; }, { syncMs: 200 });
    setLive(id, { stage: 'start', label: 'Starting' });
    if (syncReady()) {   // claim it, so two devices never make the same brief
      await syncNow(false);
      r = App.recs.get(id);
      if (!r || r.deleted_at || r.status === 'ready') return;
      if (r.claim && r.claim.by !== me) { logEvent('engine', `"${r.title || id}" is being made on ${r.claim.by}.`); return; }
    }
    const work = Object.assign({ parts: {} }, await Store.get('kv', 'w:' + id));
    const saveWork = () => queueWrite('kv', 'w:' + id, work);
    const remake = r.remake || '';
    if (remake) editRec(id, x => { delete x.remake; }, { quiet: true });
    if (remake === 'rewatch') { work.parts = {}; saveWork(); }

    // 1. what the video is
    if (r.kind === 'youtube' && (!r.title || !r.channel)) {
      setLive(id, { stage: 'meta', label: 'Looking up the video' });
      const m = await oembed(r.videoId);
      if (m && !m.missing) r = editRec(id, x => { x.title = x.title || m.title; x.channel = x.channel || m.channel; x.channelUrl = x.channelUrl || m.channelUrl; }, { quiet: true });
      else if (m && m.missing) work.oembedMissing = m.missing;
    }
    if (r.kind === 'youtube' && !r.durationS) {
      setLive(id, { stage: 'meta', label: 'Checking how long it is' });
      const d = await Player.probe(r.videoId);
      if (d) r = editRec(id, x => { x.durationS = Math.round(d); }, { quiet: true });
    }

    // 2. the transcript
    let t = await getTx(id);
    if (!t.tx || !t.tx.segments || !t.tx.segments.length || remake === 'rewatch') {
      let tx = null;
      if (r.kind === 'text') tx = t.fallbackTx;
      else {
        try { tx = await this.watch(id, work, saveWork, signal); }
        catch (e) {
          if (e.cls && e.cls.code === 'video_closed' && t.fallbackTx && t.fallbackTx.segments.length) {
            tx = t.fallbackTx;
            logEvent('engine', `Gemini couldn’t open "${r.title}", so YouTube’s own transcript was used.`);
          } else throw e;
        }
      }
      if (!tx || !tx.segments || !tx.segments.length) throw new Fail('no_speech', 'No speech was found, so there is nothing to brief. If the video does have speech, try again or use Brief it on its YouTube page.', 'watch');
      t = await setTx(id, { tx }, { quiet: true });
    }

    // 3. the brief
    await this.write(id, signal);
    queueWrite('kv', 'w:' + id, undefined);
    if (work.file && work.file.name) deleteGemFile(work.file.name);
  },

  async watch(id, work, saveWork, signal) {
    let r = App.recs.get(id);
    let media;
    if (r.kind === 'youtube') media = { file_data: { file_uri: VB.watchUrl(r.videoId) } };
    else {
      const fresh = work.file && Date.now() - work.file.at < 40 * 3600000;
      if (!fresh) {
        const f = App.files.get(id);

    if (!before || !App.recs.has(id)) continue;
    editRec(id, x => {
      for (const k of Object.keys(x)) if (k !== 'id' && k !== '_ft' && k !== 'updated_at') delete x[k];
      for (const [k, v] of Object.entries(before)) if (k !== '_ft' && k !== 'updated_at') x[k] = VB.clone(v);

}

async function addYouTube(p, extra = {}) {

    if (extra.tx && extra.tx.segments.length) { const t = await getTx(id); if (!t.fallbackTx) await setTx(id, { fallbackTx: extra.tx }, { quiet: true }); }
    if (cur.status === 'failed' && extra.tx && cur.error && cur.error.code === 'video_closed') { Engine.retry(id); toast('Got YouTube’s transcript; making the brief from it now.'); }
    else if (!extra.quiet) toast('Already in your library, so it’s open now.');
    if (!extra.noSelect) select(id);
    return cur;
  }
  if (cur && cur.deleted_at) { editRec(id, x => { delete x.deleted_at; }); if (!extra.noSelect) select(id); toast('It was in Trash; it’s back.'); return cur; }
  const rec = { id, kind: 'youtube', videoId: p.videoId, url: VB.watchUrl(p.videoId), title: String(extra.title || '').slice(0, 300), channel: String(extra.channel || '').slice(0, 200), durationS: Math.round(extra.durationS || 0) || 0,
    addedAt: VB.nowIso(), addedBy: App.sync.device, status: 'queued', claim: null, error: null, card: null, body: '', flags: [], tags: [], topic: '', starred: false, readAt: null, qa: [] };
  addRec(rec);
  if (extra.tx && extra.tx.segments.length) await setTx(id, { fallbackTx: extra.tx }, { quiet: true });
  logEvent('add', `Added ${rec.title || p.videoId}.`);
  if (!extra.noSelect) select(id);
  Engine.kick();
  return rec;
}
function addFromText(text, o = {}) {
  const links = VB.findYouTubeLinks(text);
  if (String(text || '').trim().length > 400 && links.length <= 1) { addPastedTranscript(text, links[0]); return 1; }   // a transcript from NoteGPT or similar
  if (!links.length) { if (o.explain) toast('That isn’t a YouTube link. Paste a link like youtube.com/watch?v=… or youtu.be/…'); return 0; }
  links.forEach((p, i) => addYouTube(p, { noSelect: i > 0 || (links.length > 1), quiet: links.length > 1 }));
  if (links.length > 1) { toast(`Added ${plural(links.length, 'video')} to the queue.`); App.filter = 'making'; render(); }

/* A transcript pasted as text (NoteGPT, YouTube's own panel, anywhere). With a YouTube link in it, the brief gets
   the video player; either way Gemini skips watching and goes straight to writing. */
async function addPastedTranscript(text, link) {

  const parsed = VB.parseCaptions(body);
  if (!parsed.segments.length) { toast('No transcript text found in what you pasted.'); return; }
  const tx = { source: 'pasted', segments: parsed.segments.map(s => [s.t == null ? null : Math.round(s.t), s.text, '']), screen: [], language: '', at: VB.nowIso() };
  const last = tx.segments.reduce((m, s) => s[0] != null ? Math.max(m, s[0]) : m, 0);
  if (link) {
    const id = 'yt_' + link.videoId, cur = App.recs.get(id);
    if (cur && !cur.deleted_at) {
      if (cur.status !== 'ready') { await setTx(id, { tx }, { quiet: true }); Engine.retry(id); toast('Using the pasted transcript for this video.'); }
      else toast('Already in your library, so it’s open now.');

    }
    if (cur) purgeRec(id);
    const rec = { id, kind: 'youtube', videoId: link.videoId, url: VB.watchUrl(link.videoId), title: '', channel: '', durationS: 0,
      addedAt: VB.nowIso(), addedBy: App.sync.device, status: 'queued', claim: null, error: null, card: null, body: '', flags: [], tags: [], topic: '', starred: false, readAt: null, qa: [] };

  }

  const id = 't_' + VB.rid(10);
  const rec = { id, kind: 'text', fileName: '', title: first.length > 90 ? first.slice(0, 87) + '…' : first, durationS: last ? last + 15 : 0, durationGuess: true,
    addedAt: VB.nowIso(), addedBy: App.sync.device, status: 'queued', claim: null, error: null, card: null, body: '', flags: [], tags: [], topic: '', starred: false, readAt: null, qa: [] };

}
const MEDIA_RE = /\.(mp4|m4v|mov|webm|mkv|avi|mpeg|mpg|3gp|mp3|m4a|wav|aac|ogg|oga|flac|opus|wma)$/i;

  for (const f of files) {
    if (TEXT_RE.test(f.name) || /^text\//.test(f.type)) await addTranscriptFile(f);
    else if (MEDIA_RE.test(f.name) || /^(video|audio)\//.test(f.type)) await addRecording(f);

  if (!parsed.segments.length) { toast(`No text found in “${f.name}”.`); return; }
  // a file that sits beside a recording already in the library? It's just a transcript: brief it from the text.
  const id = 't_' + VB.rid(10);

  const last = segs.reduce((m, s) => s[0] != null ? Math.max(m, s[0]) : m, 0);

  addRec(rec);
  const tx = { source: 'file', segments: segs, screen: [], language: '', at: VB.nowIso() };

}

    const ok = await new Promise(res => {
      const again = h('input', { type: 'checkbox' });

        body: [h('p', { class: 'mtext' }, h('b', { text: f.name }), ` (${(f.size / 1048576).toFixed(0)} MB) goes to Google’s Gemini service to be transcribed. Gemini deletes it within 48 hours, and Video Briefs deletes it as soon as the brief is made.`),
          h('p', { class: 'mtext' }, h('b', { text: 'On the free tier Google may use what you upload to improve its models. ' }), 'Don’t use this for anything with patient details or other confidential material.'),
          h('label', { class: 'chk' }, again, 'Don’t ask again on this device')],

    });

  }

  const prior = [...App.recs.values()].find(r => r.kind === 'file' && r.fileName === f.name && r.fileSize === f.size);
  if (prior) {
    App.files.set(prior.id, f); App.fileUrls.set(prior.id, URL.createObjectURL(f));
    if (prior.deleted_at) editRec(prior.id, x => { delete x.deleted_at; });
    if (prior.status === 'failed') Engine.retry(prior.id);
    Player.recId = null; select(prior.id); toast('This recording is already here; it’s open and playable now.');
    return;
  }
  const id = 'f_' + VB.rid(10);
  const dur = await mediaDuration(f);
  App.files.set(id, f); App.fileUrls.set(id, URL.createObjectURL(f));
  const rec = { id, kind: 'file', fileName: f.name, fileSize: f.size, mime: f.type || '', title: f.name.replace(/\.[^.]+$/, '').replace(/[._]+/g, ' ').trim(), durationS: Math.round(dur) || 0,
    addedAt: VB.nowIso(), addedBy: App.sync.device, status: 'queued', claim: { by: App.sync.device, at: VB.nowIso() }, error: null, card: null, body: '', flags: [], tags: [], topic: '', starred: false, readAt: null, qa: [] };
  addRec(rec);
  select(id); Engine.kick();

async function importFile(f) {
  let j = null;
  try { j = JSON.parse(await f.text()); } catch (e) { }
  if (!j || j.app !== 'video-briefs' || !Array.isArray(j.briefs)) { toast('That file isn’t a Video Briefs export.'); return; }
  let added = 0, merged = 0;
  for (const b of j.briefs) {
    if (!b || typeof b.id !== 'string' || !/^[A-Za-z0-9_-]{3,120}$/.test(b.id)) continue;
    const tx = { tx: b.tx || null, fallbackTx: b.fallbackTx || null };
    const rec = VB.clone(b); delete rec.tx; delete rec.fallbackTx;
    const cur = App.recs.get(b.id);
    const next = cur ? VB.mergeRecords(cur, rec) : rec;
    if (cur && VB.deepEq(next, cur)) continue;
    App.recs.set(b.id, next); queueWrite('recs', b.id, next);
    if (!cur || next.txh === rec.txh) { App.txCache.set(b.id, tx); queueWrite('tx', b.id, tx); }
    markDirty(b.id);
    cur ? merged++ : added++;
  }
  logEvent('data', `Imported ${f.name}: ${added} new, ${merged} updated.`);
  toast(`Imported: ${added} new, ${merged} updated.`);
  renderSoon(); syncSoon(1000); Engine.kick();
}

    h('div', { class: 'field' }, h('span', { text: 'Reading text size' }), seg([['s', 'Smaller'], ['m', 'Normal'], ['l', 'Larger']], App.ui.size || 'm', v => { App.ui.size = v; })),
    installPrompt ? h('div', { class: 'field' }, h('span', { text: 'App window' }), h('div', {}, h('button', { class: 'btn sm', onclick: async () => { installPrompt.prompt(); installPrompt = null; redraw(); } }, 'Install Video Briefs as an app'))) : null,
    h('div', { class: 'field' }, h('span', { text: 'Keyboard' }), keyTable()));
}
function keyTable() { return h('table', { class: 'tbl' }, KEYS.map(([k, v]) => h('tr', {}, h('td', {}, h('kbd', { text: k })), h('td', { text: v })))); }
function showKeys() { modal({ title: 'Keyboard shortcuts', body: keyTable() }); }

/* ============ Boot: one tab in charge, links from the Brief it bookmark, paste, drop, keys ============ */
let releaseLock = null, bc = null;
function holdLock(wait) {
  return new Promise(res => {
    if (!navigator.locks || !navigator.locks.request) return res(true);
    const cb = lock => { if (!lock) { res(false); return; } res(true); return new Promise(r => { releaseLock = r; }); };
    if (wait) { navigator.locks.request('videobriefs-main', cb); return; }
    let signal; try { signal = AbortSignal.timeout(1500); } catch (e) { signal = undefined; }
    navigator.locks.request('videobriefs-main', signal ? { signal } : { ifAvailable: true }, cb).catch(() => res(false));
  });
}
function showElsewhere(text, btn, fn) {
  const el = $('#elsewhere');
  el.replaceChildren(h('div', { class: 'modal', style: { padding: '26px', textAlign: 'center', width: 'min(440px,100%)' } },
    h('p', { class: 'mtext', text }), btn ? h('button', { class: 'btn primary', text: btn, onclick: fn }) : null));
  el.hidden = false;
}

/* ---------- messages from the Brief it bookmark (a YouTube page) ---------- */
const seenAdds = new Map();
function cleanBookmarkTx(raw) {
  if (!Array.isArray(raw) || !raw.length) return null;
  const segs = raw.slice(0, 20000).filter(s => Array.isArray(s) && typeof s[1] === 'string').map(s => ({ t: Number(s[0]) >= 0 ? Number(s[0]) : null, text: s[1].replace(/\s+/g, ' ').trim().slice(0, 2000) })).filter(s => s.text && s.t != null);
  if (!segs.length) return null;
  return { source: 'youtube', segments: VB.groupSegments(segs).map(s => [Math.round(s.t), s.text, '']), screen: [], language: '', at: VB.nowIso() };
}
function onBookmarkMessage(e) {
  if (!/^https:\/\/(www|m)\.youtube\.com$/.test(e.origin)) return;
  const d = e.data;
  if (!d || d.vb !== 'add' || typeof d.url !== 'string') return;
  const stage = d.stage === 'tx' ? 'tx' : 'add';
  try { e.source.postMessage({ vb: 'ack', stage }, e.origin); } catch (err) { }
  const p = VB.parseYouTube(d.url);
  if (!p) return;
  const k = p.videoId + '|' + stage;
  if (seenAdds.has(k) && Date.now() - seenAdds.get(k) < 60000) return;
  seenAdds.set(k, Date.now());
  const payload = { videoId: p.videoId, title: String(d.title || '').slice(0, 300), channel: String(d.channel || '').slice(0, 200), durationS: Number(d.durationS) || 0, tx: stage === 'tx' ? cleanBookmarkTx(d.tx) : null, stage };
  if (App.owner) takeBookmark(payload);
  else if (bc) { bc.postMessage({ t: 'add', from: App.tabId, payload }); relayed(stage); }
}
function takeBookmark(pl) {
  const extra = { title: pl.title, channel: pl.channel, durationS: pl.durationS, tx: pl.tx };
  if (pl.stage === 'tx') { if (pl.tx) addYouTube({ videoId: pl.videoId }, Object.assign(extra, { quiet: true, noSelect: true })); return; }
  addYouTube({ videoId: pl.videoId }, extra);
  try { window.focus(); } catch (e) { }
}
let relayTimer = 0;
function relayed(stage) {
  showElsewhere(stage === 'tx' ? 'Sent to Video Briefs in your other tab, with YouTube’s transcript. You can close this tab.' : 'Sent to Video Briefs in your other tab. Fetching YouTube’s transcript too…', 'Close this tab', () => window.close());
  clearTimeout(relayTimer);
  relayTimer = setTimeout(() => { try { window.close(); } catch (e) { } }, stage === 'tx' ? 1500 : 16000);
}

async function boot() {
  loadUI(); applyTheme();
  try { bc = new BroadcastChannel('videobriefs-app'); } catch (e) { bc = null; }
  window.addEventListener('message', onBookmarkMessage);
  if (bc) bc.onmessage = async e => {
    const d = e.data; if (!d || d.from === App.tabId) return;
    if (d.t === 'takeover' && App.owner) {
      await flush();
      if (Engine.ctl) Engine.ctl.abort();
      App.owner = false; App.booted = false; clearTimeout(Sync.timer);
      if (releaseLock) releaseLock();
      showElsewhere('Video Briefs is now open in another tab or window.', 'Use it here instead', () => location.reload());
    }
    if (d.t === 'add' && App.owner && d.payload) takeBookmark(d.payload);
  };
  if (!await holdLock(false)) {
    if (/^#brief-it/.test(location.hash)) { showElsewhere('Sending this video to your open Video Briefs tab…'); return; }
    showElsewhere('Video Briefs is already open in another tab or window. Using two at once could overwrite changes.', 'Use it here instead', async () => {
      if (bc) bc.postMessage({ t: 'takeover', from: App.tabId });
      $('#elsewhere').hidden = true;
      await holdLock(true);
      start();
    });
    return;
  }
  start();
}
async function start() {
  App.owner = true;
  try { window.name = 'videobriefs'; } catch (e) { }
  await Store.open();
  try { await loadState(); }
  catch (e) { App.readFailed = true; logEvent('error', 'Could not read saved briefs: ' + (e && e.message || e)); }
  // anything left "working" by a closed tab is resumed by the queue
  bindUI();
  let link = null, open = null;
  if (/^#sync=/.test(location.hash)) link = readSetupHash();
  const hb = /^#b=(.+)$/.exec(location.hash); if (hb) open = decodeURIComponent(hb[1]);
  const ha = /^#add=(.+)$/.exec(location.hash);
  App.booted = true;
  if (open && App.recs.has(open)) select(open); else render();
  if (App.readFailed) {
    $('#banners').append(h('div', { class: 'banner bad' }, h('span', { text: 'This browser couldn’t read your saved briefs, so nothing will be saved until Video Briefs is reloaded. Your data has not been touched.' }), h('button', { class: 'btn sm', text: 'Reload', onclick: () => location.reload() })));
    return;
  }
  if (/^#brief-it/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } }
  if (ha) { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { } addFromText(decodeURIComponent(ha[1]), { explain: true }); }
  syncInit();
  if (link) offerSetupLink(link);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
  if (App.recs.size) requestPersist();
  Engine.kick();
}
let persistAsked = false;
function requestPersist() {
  if (persistAsked || !navigator.storage || !navigator.storage.persist) return;
  persistAsked = true;
  navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => { });
}

function bindUI() {
  $('#search-ic').outerHTML = ICON.search;
  $('#q-clr').innerHTML = ICON.close; $('#settings-btn').innerHTML = ICON.gear; $('#help-btn').innerHTML = ICON.keyboard;
  $('#build-tag').textContent = typeof BUILD === 'string' ? BUILD : '';
  $('#add-form').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('#add-in').value.trim();
    if (!v) { $('#add-in').focus(); return; }
    if (addFromText(v, { explain: true })) $('#add-in').value = '';
  });
  $('#add-in').addEventListener('paste', e => {
    const t = e.clipboardData && e.clipboardData.getData('text');
    if (t && (VB.findYouTubeLinks(t).length || t.trim().length > 400)) { e.preventDefault(); addFromText(t); $('#add-in').value = ''; }
  });
  const q = $('#q');
  let qt = 0;
  q.addEventListener('input', () => { clearTimeout(qt); qt = setTimeout(() => { App.q = q.value; App.libLimit = 150; $('#q-clr').hidden = !q.value; $('#q-kbd').hidden = !!q.value; renderFilters(); renderList(); }, 120); });
  q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; App.q = ''; $('#q-clr').hidden = true; $('#q-kbd').hidden = false; renderList(); q.blur(); } if (e.key === 'Enter') { const first = listRecs()[0]; if (first) select(first.id); } });
  $('#q-clr').onclick = () => { q.value = ''; App.q = ''; $('#q-clr').hidden = true; $('#q-kbd').hidden = false; renderList(); q.focus(); };
  $('#settings-btn').onclick = () => openSettings();
  $('#help-btn').onclick = showKeys;
  $('#sync-pill').onclick = () => openSettings('sync');
  $('#file-in').addEventListener('change', e => { const fs = [...(e.target.files || [])]; if (fs.length) addFiles(fs); e.target.value = ''; });
  // paste anywhere (outside text boxes): YouTube links are added at once
  document.addEventListener('paste', e => {
    const t = e.target;
    if (t && t.closest && t.closest('input,textarea,[contenteditable]')) return;
    const files = [...((e.clipboardData && e.clipboardData.files) || [])];
    if (files.length) { e.preventDefault(); addFiles(files); return; }
    const text = e.clipboardData && e.clipboardData.getData('text');
    if (text && (VB.findYouTubeLinks(text).length || text.trim().length > 400)) { e.preventDefault(); addFromText(text); }
    else if (text) toast('Nothing to brief on the clipboard: copy a YouTube link or a transcript first.');
  });
  // drag and drop: files or links
  let dragDepth = 0;
  const isDrag = e => e.dataTransfer && [...e.dataTransfer.types].some(t => t === 'Files' || t === 'text/uri-list' || t === 'text/plain');
  window.addEventListener('dragenter', e => { if (!isDrag(e)) return; dragDepth++; $('#drop').hidden = false; });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#drop').hidden = true; });
  window.addEventListener('dragover', e => { if (isDrag(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    dragDepth = 0; $('#drop').hidden = true;
    if (!e.dataTransfer) return;
    e.preventDefault();
    const files = [...(e.dataTransfer.files || [])];
    if (files.length) { addFiles(files); return; }
    const text = e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text/plain');
    if (text) addFromText(text, { explain: true });
  });
  window.addEventListener('hashchange', () => {
    if (/^#sync=/.test(location.hash)) { const l = readSetupHash(); if (l) offerSetupLink(l); return; }
    if (/^#brief-it/.test(location.hash)) { try { history.replaceState(null, '', location.pathname + location.search + (App.sel ? '#b=' + encodeURIComponent(App.sel) : '')); } catch (e) { } return; }
    const ha = /^#add=(.+)$/.exec(location.hash); if (ha) { try { history.replaceState(null, '', location.pathname); } catch (e) { } addFromText(decodeURIComponent(ha[1]), { explain: true }); }
  });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; });
  window.addEventListener('resize', () => renderSoon());
  document.addEventListener('keydown', onKey);
}
function onKey(e) {
  if (!App.booted || e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
  if (document.querySelector('#modal-root .scrim') || !$('#elsewhere').hidden) return;
  if ($('#menu')) { if (e.key === 'Escape') closeMenu(); return; }
  const t = e.target;
  if (t && t.closest && t.closest('input,textarea,select,[contenteditable]')) return;
  const k = e.key, r = App.sel && App.recs.get(App.sel);
  const move = d => { const rs = listRecs(); if (!rs.length) return; const i = rs.findIndex(x => x.id === App.sel); select(rs[Math.max(0, Math.min(rs.length - 1, i < 0 ? 0 : i + d))].id); };
  if (k === '/') { e.preventDefault(); $('#q').focus(); $('#q').select(); }
  else if (k === 'n' || k === 'N') { e.preventDefault(); $('#add-in').focus(); }
  else if (k === 'j' || k === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (k === 'k' || k === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (r && (k === '1' || k === '2' || k === '3')) setTab(['brief', 'transcript', 'ask'][+k - 1]);
  else if (r && k === 'a') { e.preventDefault(); Reader.focusAsk = true; setTab('ask'); setTimeout(() => { const i = $('#ask-in'); if (i) i.focus(); }, 30); }
  else if (r && k === 's' && !r.deleted_at) toggleStar(r.id);
  else if (r && k === 'u' && r.status === 'ready') sendToUpNote(r.id);
  else if (r && k === 'Delete') { if (r.deleted_at) purgeForever([r.id]); else trashRec(r.id); }
  else if (k === '?') showKeys();
  else if (k === 'Escape') { if (App.sel && window.innerWidth <= 760) closeReader(); }
}
boot();

</script>
